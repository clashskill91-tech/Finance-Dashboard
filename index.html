<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Finance Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ============ LOADING SCREEN ============ -->
  <div id="loading-screen" class="loading-screen">
    <div class="loader-brand">
      <div class="loader-mark">
        <svg viewBox="0 0 48 48" width="48" height="48">
          <path d="M6 34 L16 20 L24 28 L42 8" fill="none" stroke="url(#loaderGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
          <defs>
            <linearGradient id="loaderGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#2563EB"/>
              <stop offset="1" stop-color="#22C55E"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div class="loader-title">Smart Finance</div>
      <div class="loader-bar"><span id="loader-progress"></span></div>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="app" class="app">

    <!-- ===== SIDEBAR ===== -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-mark">
            <svg viewBox="0 0 48 48" width="22" height="22">
              <path d="M6 34 L16 20 L24 28 L42 8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="brand-name">Finance</span>
        </div>
        <button class="sidebar-toggle" id="sidebarToggle" title="Yig'ish/Yoyish">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h16"/></svg>
        </button>
      </div>

      <nav class="nav" id="nav">
        <div class="nav-indicator" id="navIndicator"></div>
        <a href="#/dashboard" class="nav-item" data-route="dashboard">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11 12 4l8 7"/><path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/><path d="M10 20v-5h4v5"/></svg></span><span class="nav-label">Dashboard</span>
        </a>
        <a href="#/income" class="nav-item" data-route="income">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="15 6 21 6 21 12"/></svg></span><span class="nav-label">Kirim</span>
        </a>
        <a href="#/expense" class="nav-item" data-route="expense">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 7 9 13 13 9 21 18"/><polyline points="15 18 21 18 21 12"/></svg></span><span class="nav-label">Chiqim</span>
        </a>
        <a href="#/reports" class="nav-item" data-route="reports">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="3.6" height="10" rx="1"/><rect x="10.2" y="4" width="3.6" height="16" rx="1"/><rect x="16.4" y="13" width="3.6" height="7" rx="1"/></svg></span><span class="nav-label">Hisobot</span>
        </a>
        <a href="#/goals" class="nav-item" data-route="goals">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></span><span class="nav-label">Maqsadlar</span>
        </a>
        <a href="#/budget" class="nav-item" data-route="budget">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg></span><span class="nav-label">Budjet</span>
        </a>
        <a href="#/stats" class="nav-item" data-route="stats">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 12 6 12 9 4 13 20 16 12 22 12"/></svg></span><span class="nav-label">Statistika</span>
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
          <span class="nav-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2" fill="currentColor" stroke="none"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2" fill="currentColor" stroke="none"/></svg></span><span class="nav-label">Sozlamalar</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="mini-quote" id="miniQuote"></div>
      </div>
    </aside>

    <!-- ===== MAIN COLUMN ===== -->
    <div class="main-col">

      <!-- ===== HEADER ===== -->
      <header class="header">
        <div class="header-left">
          <button class="icon-btn mobile-menu-btn" id="mobileMenuBtn" title="Menyu">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <div class="header-title" id="pageTitle">Dashboard</div>
            <div class="header-sub" id="headerDate">—</div>
          </div>
        </div>

        <div class="header-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="globalSearch" placeholder="Qidirish... (tranzaksiya, kategoriya)" autocomplete="off">
          <div class="search-results" id="searchResults"></div>
        </div>

        <div class="header-right">
          <div class="header-clock" id="headerClock">00:00:00</div>
          <button class="icon-btn" id="notifBtn" title="Bildirishnomalar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
            <span class="notif-dot" id="notifDot"></span>
          </button>
          <button class="icon-btn" id="darkModeBtn" title="Tungi rejim">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
          </button>
          <div class="user-menu" id="userMenu">
            <img src="avatar.svg" alt="Foydalanuvchi" class="avatar" id="avatarImg">
            <div class="user-dropdown" id="userDropdown">
              <div class="user-dropdown-name" id="dropdownName">Foydalanuvchi</div>
              <a href="#/settings" data-route="settings"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 5-6 8-6s6.5 2 8 6"/></svg> Profilni tahrirlash</a>
              <a href="#" id="printBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="4" y="9" width="16" height="8" rx="1"/><path d="M6 17v4h12v-4"/></svg> Chop etish</a>
              <a href="#" id="exportPdfBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6Z"/><line x1="9" y1="14" x2="15" y2="14"/><line x1="9" y1="17" x2="13" y2="17"/></svg> PDF eksport</a>
              <a href="#" id="exportExcelBtn"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5"/><path d="M6 3h8l5 5v13H6Z"/><line x1="9.5" y1="13" x2="14.5" y2="18"/><line x1="14.5" y1="13" x2="9.5" y2="18"/></svg> Excel eksport</a>
              <div class="user-dropdown-divider"></div>
              <a href="#" id="logoutBtn" class="user-dropdown-danger"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Chiqish</a>
            </div>
          </div>
        </div>
      </header>

      <!-- ===== DYNAMIC MAIN ===== -->
      <main id="main" class="main"></main>
    </div>
  </div>

  <!-- ===== TOAST CONTAINER ===== -->
  <div class="toast-container" id="toastContainer"></div>

  <!-- ===== MODAL ROOT ===== -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalRoot"></div>
  </div>

  <!-- ===== CONFETTI CANVAS ===== -->
  <canvas id="confettiCanvas" class="confetti-canvas"></canvas>

  <script src="auth.js"></script>
  <script src="script.js"></script>
</body>
</html>
